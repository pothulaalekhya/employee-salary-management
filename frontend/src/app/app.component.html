<div class="app-layout">
  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-section">
        <div class="brand-logo">
          <mat-icon>payments</mat-icon>
        </div>
        <div class="brand-text">
          <span class="brand-title">ACME Corp</span>
          <span class="brand-subtitle">Salary Management System</span>
        </div>
      </div>

      <nav class="nav-links">
        <a
          routerLink="/employees"
          routerLinkActive="nav-active"
          class="nav-item"
        >
          <mat-icon>badge</mat-icon>
          <span>Employees</span>
        </a>
        <a
          routerLink="/analytics"
          routerLinkActive="nav-active"
          class="nav-item"
        >
          <mat-icon>insights</mat-icon>
          <span>Analytics</span>
        </a>
      </nav>

      <div class="header-actions">
        @if (backendOnline) {
          <div class="status-indicator online" title="Backend API operational on port 8081">
            <span class="status-dot"></span>
            <span>API Online</span>
          </div>
        } @else {
          <div class="status-indicator offline" title="Backend API unreachable">
            <span class="status-dot"></span>
            <span>API Offline</span>
          </div>
        }
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
