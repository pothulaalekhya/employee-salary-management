spring.application.name=employee-salary-management

# Database Configuration with Environment Variable Placeholders
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/salary_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:salary_user}
spring.datasource.password=${DB_PASSWORD:salary_secure_pass123!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Using ddl-auto=update for simple automated schema creation in this take-home project.
# In a production enterprise system, versioned database migration tools like Flyway or Liquibase
# would be used for strictly controlled, reproducible schema migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


server.port=${PORT:8081}

# CORS Configuration
# Defaults to local dev ports; override in production via CORS_ALLOWED_ORIGINS (e.g. "https://app.acmecorp.com")
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
